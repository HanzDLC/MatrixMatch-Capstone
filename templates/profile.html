{% extends "base.html" %}
{% block title %}My Profile - MatrixMatch{% endblock %}

{% block content %}
<div class="page-shell">
    <div class="page-header">
        <div>
            <h1 class="page-title">My Profile</h1>
            <p class="page-subtitle">Update your personal information and account security.</p>
        </div>
    </div>
    <div class="card form-card form-card--compact">
        <form method="post" action="{{ url_for('profile') }}">
            <div class="form-group">
                <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
                <input type="text" id="first_name" name="first_name" class="form-input" value="{{ user.first_name }}"
                    required>
            </div>

            <div class="form-group">
                <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
                <input type="text" id="last_name" name="last_name" class="form-input" value="{{ user.last_name }}"
                    required>
            </div>

            <hr class="section-divider">
            <h3 class="section-heading">Change Password</h3>
            <p class="helper-text">Leave blank if you do not want to change your password.
            </p>

            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="********">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                    placeholder="********">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
